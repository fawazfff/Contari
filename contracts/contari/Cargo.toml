[package]
name = "contari"
version = "0.2.0"
edition = "2024"

[dependencies]
tari_template_lib = { version = "=0.37.0", features = ["serde"] }

[dev-dependencies]
tari_template_test_tooling = "=0.49.2"
bech32 = "=0.11.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = true
