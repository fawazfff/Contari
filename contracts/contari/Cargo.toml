[package]
name = "contari"
version = "0.2.0"
edition = "2024"

[dependencies]
tari_template_lib = { version = "=0.37.0", features = ["serde"] }
blake2 = "=0.10.6"
bech32 = "=0.11.1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = true
