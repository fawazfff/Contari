name: Build and test Contari
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: denoland/setup-deno@v2
      - run: deno test --allow-net supabase/functions/contari-secure/crypto_test.ts supabase/functions/contari-secure/ootle_verification_test.ts
      - name: Test deployed secure key service
        run: deno test --allow-net --allow-env=CONTARI_SUPABASE_URL,CONTARI_SUPABASE_PUBLISHABLE_KEY supabase/functions/contari-secure/edge_integration_test.ts
        env:
          CONTARI_SUPABASE_URL: https://ajqukplphetzavnfcxio.supabase.co
          CONTARI_SUPABASE_PUBLISHABLE_KEY: sb_publishable_p7M3OA6dClrOTRM5sKHM2A_c8kjIPvu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contari-playwright-report
          path: playwright-report/
          retention-days: 7
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --manifest-path contracts/contari/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: contari-ootle-template-wasm
          path: contracts/contari/target/wasm32-unknown-unknown/release/contari.wasm
          if-no-files-found: error
